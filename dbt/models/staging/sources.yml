version: 2

sources:
  - name: raw
    description: >
      Raw incident telemetry landing zone — events written by Databricks
      (event_hub_to_delta.py) from Azure Event Hub into ADLS Gen2 as Delta files,
      exposed to dbt via Synapse Serverless SQL (dbo.v_raw_events OPENROWSET view).
    database: aiip_raw
    schema: dbo
    tables:
      - name: v_raw_events
        description: >
          Unified view over ALL raw telemetry: GitHub deployment events,
          synthetic app_logs, k8s_events, Prometheus metrics, and OTel traces.
          Each row is one AIIP canonical event envelope:
            event_id | event_type | source | timestamp | service_name | payload (JSON)
        columns:
          - name: event_id
            description: Unique UUID for this event (deterministic for deployments, random for others)
            tests:
              - not_null
              - unique

          - name: event_type
            description: "One of: deployment, log, k8s_event, metric, trace"
            tests:
              - not_null
              - accepted_values:
                  name: source_event_type_valid_values
                  values: ["deployment", "log", "k8s_event", "metric", "trace"]

          - name: source
            description: "Signal origin: github_actions | app_logs | k8s_logs | prometheus | opentelemetry"
            tests:
              - not_null

          - name: timestamp
            description: ISO-8601 UTC timestamp of when the event was recorded
            tests:
              - not_null

          - name: service_name
            description: Name of the AIIP microservice that generated the event
            tests:
              - not_null

          - name: payload
            description: JSON blob containing signal-specific fields (varies by event_type)
